name: Manual Build and Release (Global Gradle)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title (e.g. v1.0.0 Release)'
        required: false
        default: 'Android Build Release'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 检出代码 (官方 Action)
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. 配置 JDK 环境 (官方 Action)
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 使用 Gradle 官方 Action 配置环境与缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 直接使用全局 gradle 命令执行编译打包
      - name: Build Release APK with Gradle
        run: gradle assembleDebug

      # 5. 使用 Marketplace 官方 Action 上传 APK 到 GitHub Releases
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            **/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
